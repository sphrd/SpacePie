name: build

on:
  push:
    branches: [ main, 'dev/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Headless self-check
        shell: pwsh
        run: |
          $log = New-TemporaryFile
          Start-Process .\SpacePie.exe -ArgumentList '--cli','scan',"`"$env:WINDIR\System32\drivers`"" -Wait -NoNewWindow -RedirectStandardOutput $log.FullName
          $out = Get-Content $log.FullName
          $out
          if (-not ($out -match 'bytes')) { throw 'self-check produced no result' }

      - name: End-to-end self-test (live updates, delete list, Recycle Bin, duplicates, export)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process .\SpacePie.exe -ArgumentList '--cli', 'selftest', "$env:RUNNER_TEMP\dsa-selftest" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'self-test timed out' }
          Get-Content "$env:RUNNER_TEMP\dsa-selftest.log"
          if ($p.ExitCode -ne 0) { throw 'self-test failed' }

      - name: Master file table self-check (the runner is elevated)
        shell: pwsh
        timeout-minutes: 12
        run: |
          function Scan([string[]] $a, [int] $seconds) {
            $out = New-TemporaryFile
            $p = Start-Process .\SpacePie.exe -ArgumentList $a -NoNewWindow -PassThru -RedirectStandardOutput $out.FullName
            if (-not $p.WaitForExit($seconds * 1000)) { Stop-Process -Id $p.Id -Force; Get-Content $out.FullName; throw "timed out after $seconds s: $a" }
            Get-Content $out.FullName -Raw
          }
          $mft = Scan @('--cli', 'scan', 'C:\', '--mft', '--files') 240
          "--- master file table ---"; $mft
          $m = ($mft.Trim().Split("`n")[0]).Split("`t")
          if ($m[6] -notmatch 'master file table') { throw 'the master file table was not used' }
          # The whole drive folder by folder takes many minutes on a runner; compare one top-level folder instead.
          $usersLine = ($mft -split "`n" | Where-Object { $_ -match '^\s+Users\s' } | Select-Object -First 1)
          $mu = [regex]::Matches($usersLine, '[\d,]+(?= bytes| files)') | ForEach-Object { [long]($_.Value -replace ',') }
          $dir = Scan @('--cli', 'scan', 'C:\Users') 300
          "--- C:\Users folder by folder ---"; $dir
          $d = ($dir.Trim().Split("`n")[0]).Split("`t")
          $db = [long]($d[1] -replace '\D'); $df = [long]($d[3] -replace '\D')
          "Users: mft $($mu[0]) bytes / $($mu[1]) files; folders $db bytes / $df files"
          if ([math]::Abs($mu[1] - $df) -gt $df * 0.1 + 20) { throw 'file counts differ too much' }
          if ([math]::Abs($mu[0] - $db) -gt $db * 0.1 + 1MB) { throw 'sizes differ too much' }
          $used = (Get-PSDrive C).Used
          $alloc = [long]($m[2] -replace '\D')
          "drive used $used, scanned on disk $alloc"
          if ($alloc -gt $used * 1.02) { throw 'size on disk is larger than the used space' }

      - name: Accuracy against robocopy (lists without copying, skips junctions and links)
        shell: pwsh
        # A fresh runner's disk is cold: the same two scans took 3 to 9 minutes, plus robocopy's own walk.
        timeout-minutes: 25
        run: |
          # Folders without SYSTEM-only subfolders: robocopy on the elevated runner lists some that stay closed to the app
          # (the app shows those as "access denied" and leaves them out), which would make System32 differ.
          foreach ($path in @("$env:ProgramFiles", "${env:ProgramFiles(x86)}")) {
            $out = New-TemporaryFile
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Start-Process .\SpacePie.exe -ArgumentList '--cli','scan',"`"$path`"" -Wait -NoNewWindow -RedirectStandardOutput $out.FullName
            $l = ((Get-Content $out.FullName | Where-Object { $_ -match 'bytes' } | Select-Object -First 1).Split("`t"))
            $db = [long]($l[1] -replace '\D'); $df = [long]($l[3] -replace '\D'); $ds = $l[5]
            $r = robocopy "$path" "$env:RUNNER_TEMP\none" /L /S /XJ /NFL /NDL /NJH /BYTES /R:0 /W:0
            $rf = [long]([regex]::Matches(($r | Select-String '^\s*Files\s*:').Line, '\d+')[0].Value)
            $rb = [long]([regex]::Matches(($r | Select-String '^\s*Bytes\s*:').Line, '\d+')[0].Value)
            "{0}: app {1:N0} files, {2:N0} bytes ({3}) / robocopy {4:N0} files, {5:N0} bytes" -f $path, $df, $db, $ds, $rf, $rb
            # robocopy counts a file symbolic link as the file it points to; the app counts the link itself (0 bytes).
            if ($df -ne $rf) { throw "file counts differ for $path" }
            if ([math]::Abs($rb - $db) -gt $rb * 0.01) { throw "sizes differ by more than 1 % for $path" }
          }
          $global:LASTEXITCODE = 0   # robocopy exits with 1 when it listed files

      - name: Window screenshots
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $out = "$env:RUNNER_TEMP\shots"
          $p = Start-Process .\SpacePie.exe -ArgumentList '--cli','screenshot',"`"$out`"","`"$env:ProgramFiles\Git`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem $out -ErrorAction SilentlyContinue | Select-Object Name

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpacePie-windows-shots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      # README / website pictures: a demo tree of sparse files shown as a made-up drive (never a real computer).
      - name: Demo screenshots (README and website)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # A screen large enough for the 1600 x 867 demo window (the runner starts at 1024 x 768).
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $_" }
          .\tools\make_demo.ps1 C:\Demo
          $out = "$env:RUNNER_TEMP\demo-shots"
          $p = Start-Process .\SpacePie.exe -ArgumentList '--cli','screenshot',"`"$out`"",'C:\Demo','--demo' -PassThru
          if (-not $p.WaitForExit(360000)) { Stop-Process -Id $p.Id -Force }
          .\tools\make_demo.ps1 C:\Demo -Remove
          Get-ChildItem $out -ErrorAction SilentlyContinue | Select-Object Name

      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpacePie-windows-demo-shots
          path: ${{ runner.temp }}/demo-shots/*.png
          if-no-files-found: ignore

      - name: SHA-256 for the release notes
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash .\SpacePie.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha=$h" >> $env:GITHUB_OUTPUT
          "SpacePie.exe SHA-256: $h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpacePie
          path: SpacePie.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpacePie.exe
          append_body: true
          body: |

            **SHA-256** (check with `Get-FileHash .\SpacePie.exe`):
            `SpacePie.exe`: `${{ steps.hash.outputs.sha }}`

  macos:
    # Runs after the Windows job, so on a tag both attach their files to the same release.
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The self-signed "sphrd" certificate (secrets MACOS_SIGN_P12, base64 .p12, and MACOS_SIGN_PASSWORD) goes into a
      # temporary keychain; build.sh signs with it. Without the secrets (forks) the build is signed ad-hoc.
      - name: Signing certificate (sphrd)
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then echo "No signing certificate: ad-hoc signature"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/"sphrd"/ { print $2; exit }')
          if [ -z "$ID" ]; then echo "sphrd identity not found"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build universal app and dmg
        run: bash macos/build.sh

      - name: Signature (sphrd certificate when available)
        run: |
          codesign --verify --deep --strict macos/build/SpacePie.app
          codesign -d -r- macos/build/SpacePie.app 2>&1 | tail -1
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign -d -r- macos/build/SpacePie.app 2>&1 | grep -q 'certificate leaf' || { echo "not signed with the sphrd certificate"; exit 1; }
          fi

      - name: Check dmg layout (background, arrow, Applications link)
        run: |
          MNT="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$RUNNER_TEMP/shots"
          hdiutil attach -readonly -noautoopen -mountpoint "$MNT" SpacePie-macOS.dmg
          ls -la "$MNT"
          macos/build/venv/bin/python macos/dmg_check.py "$MNT" macos/build/dmg_art "$RUNNER_TEMP/shots/dmg-layout.png"
          # A real Finder window too, when the runner allows screen captures.
          open "$MNT" || true
          sleep 5
          screencapture -x "$RUNNER_TEMP/shots/dmg-finder.png" || true
          hdiutil detach "$MNT" || hdiutil detach -force "$MNT"

      - name: Headless self-check
        run: |
          BIN="macos/build/SpacePie.app/Contents/MacOS/SpacePie"
          lipo -archs "$BIN"
          out=$("$BIN" --cli scan /usr/share)
          echo "$out"
          echo "$out" | grep -q 'bytes'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "macos/build/SpacePie.app/Contents/Info.plist"

      - name: Self-update install (dmg -> bundle swap, as Update now does)
        run: |
          D="$RUNNER_TEMP/update-test"
          rm -rf "$D"; mkdir -p "$D"
          ditto macos/build/SpacePie.app "$D/SpacePie.app"
          out=$("$D/SpacePie.app/Contents/MacOS/SpacePie" --cli update-install "$PWD/SpacePie-macOS.dmg")
          echo "$out"
          echo "$out" | grep -q "installed to $D/SpacePie.app"
          test -d "$D/SpacePie.app.old" && test -x "$D/SpacePie.app/Contents/MacOS/SpacePie" && test ! -e "$D/SpacePie.app.new"
          rm -rf "$D"

      - name: End-to-end self-test (live updates, delete list, Trash, duplicates, export)
        timeout-minutes: 5
        run: |
          BIN="macos/build/SpacePie.app/Contents/MacOS/SpacePie"
          "$BIN" --cli selftest "$RUNNER_TEMP/dsa-selftest" &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            kill $pid 2>/dev/null || true
            cat "$RUNNER_TEMP/dsa-selftest.log" 2>/dev/null || true
            echo "self-test timed out"; exit 1
          fi
          code=0; wait $pid || code=$?
          echo "--- self-test log ---"
          cat "$RUNNER_TEMP/dsa-selftest.log" || { echo "no self-test log"; exit 1; }
          if [ "$code" != "0" ]; then echo "self-test failed (exit code $code)"; exit 1; fi

      - name: Window screenshots
        continue-on-error: true
        run: |
          BIN="macos/build/SpacePie.app/Contents/MacOS/SpacePie"
          "$BIN" --cli screenshot "$RUNNER_TEMP/shots" /Applications &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la "$RUNNER_TEMP/shots" || true

      - name: Accuracy against du and find (sizes on disk, files)
        run: |
          BIN="macos/build/SpacePie.app/Contents/MacOS/SpacePie"
          for p in /usr/share /Applications; do
            line=$("$BIN" --cli scan "$p" | grep bytes | head -1)
            alloc=$(echo "$line" | cut -f3 | tr -dc 0-9)
            files=$(echo "$line" | cut -f4 | tr -dc 0-9)
            secs=$(echo "$line" | cut -f6)
            du_k=$(du -sk -x "$p" 2>/dev/null | cut -f1)
            find_f=$(find -x "$p" -type f 2>/dev/null | wc -l | tr -d " ")
            echo "$p: app $files files, $alloc bytes on disk ($secs) / du $((du_k * 1024)) bytes, find $find_f files"
            # du also counts the folders themselves; a few per cent apart is expected, more is an error.
            awk -v a="$alloc" -v d="$((du_k * 1024))" 'BEGIN { if (d > 0 && (a - d > d * 0.1 || d - a > d * 0.1)) exit 1 }' || { echo "sizes differ by more than 10 %"; exit 1; }
          done

      - name: SHA-256 for the release notes
        id: hash
        run: |
          h=$(shasum -a 256 SpacePie-macOS.dmg | cut -d" " -f1)
          echo "sha=$h" >> "$GITHUB_OUTPUT"
          echo "SpacePie-macOS.dmg SHA-256: $h"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpacePie-macOS
          path: |
            SpacePie-macOS.dmg
            ${{ runner.temp }}/shots/*.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpacePie-macOS.dmg
          append_body: true
          body: |
            `SpacePie-macOS.dmg`: `${{ steps.hash.outputs.sha }}` (check with `shasum -a 256 SpacePie-macOS.dmg`)
